name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read       # npm publish only; the GitHub Release is created separately
  id-token: write      # for npm provenance via Sigstore OIDC (trusted publishing)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Publish to npm (OIDC trusted publisher)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install npm >=11.5 in sandbox for OIDC trusted-publishing auth
        run: |
          # Node 22 bundles npm 10.x, which cannot do OIDC trusted publishing,
          # and an in-place `npm i -g npm@latest` races its own arborist rebuild.
          # Install a PINNED npm (>=11.5.1 is the OIDC-TP floor) into an isolated sandbox and
          # shadow it via PATH. Pinned, not @latest, so this publish step is reproducible and
          # can't be broken by a bad npm release floating in at tag time.
          SANDBOX="$HOME/.npm-cli-sandbox"
          mkdir -p "$SANDBOX"
          pushd "$SANDBOX" >/dev/null
          echo '{"name":"npm-cli-sandbox","version":"0.0.0","private":true}' > package.json
          npm install --no-save --no-audit --no-fund --silent 'npm@^11.5.1'
          popd >/dev/null
          echo "$SANDBOX/node_modules/.bin" >> "$GITHUB_PATH"
          "$SANDBOX/node_modules/.bin/npm" --version

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "Tag: ${GITHUB_REF_NAME} -> ${TAG_VERSION} | Package: ${PKG_VERSION}"
          if [ "${PKG_VERSION}" != "${TAG_VERSION}" ]; then
            echo "::error::Tag ${TAG_VERSION} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi

      - name: Smoke-test the CLI
        run: node scripts/smoke.mjs

      - name: Verify the PACKED tarball is runnable (gates a files-allowlist regression)
        run: |
          set -euo pipefail
          # Pack, extract OUTSIDE the repo, and run the runtime-file-dependent commands against
          # ONLY the shipped files. A working-tree smoke test and `npm pack --dry-run` both pass
          # even if package.json "files" drops a runtime-required file (PROTOCOL.md, examples/);
          # this step fails closed on that, so the published tarball is proven runnable.
          npm pack
          TARBALL=$(ls -t ./*.tgz | head -1)
          WORK=$(mktemp -d)
          tar -xzf "$TARBALL" -C "$WORK"
          PKG="$WORK/package"
          node "$PKG/bin/study-swarm.mjs" version
          node "$PKG/bin/study-swarm.mjs" protocol | grep -q "Step 1"                     # reads shipped PROTOCOL.md
          node "$PKG/bin/study-swarm.mjs" lint "$PKG/examples/study-swarm-self.dispatch.md"  # examples/ shipped
          node "$PKG/bin/study-swarm.mjs" lock --verify \
            "$PKG/examples/study-swarm-lock.dispatch.md" \
            --from "$PKG/examples/study-swarm-lock.orchestration.json"                     # lock + PROTOCOL.md
          rm -f "$TARBALL"
          echo "OK: packed tarball is runnable from its shipped files only"

      - name: Publish to npm with provenance (OIDC trusted publisher)
        run: npm publish --provenance --access public
